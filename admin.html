<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kite - Database Viewer</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        .admin-container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .back-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .db-table-wrapper {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .db-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .db-table th,
        .db-table td {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-color);
        }

        .db-table th {
            background: rgba(255, 255, 255, 0.04);
            color: var(--accent-cyan);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .db-table td {
            font-size: 0.9rem;
            color: var(--text-main);
        }

        .db-table tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .student-id {
            color: var(--primary);
            font-weight: 700;
        }
    </style>
</head>

<body>
    <div class="admin-container">
        <div class="header-bar">
            <div>
                <h2>Student Records Database</h2>
                <p style="color: var(--text-muted); font-size: 0.85rem;">Live view of <code>kite_local.db</code></p>
            </div>
            <a href="/" class="back-link">← Registration Form</a>
        </div>

        <div class="db-table-wrapper">
            <table class="db-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Program</th>
                        <th>Term</th>
                        <th>Registered Date</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody">
                    <tr>
                        <td colspan="7" style="text-align:center;">Loading database records...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadDatabase() {
            try {
                const response = await fetch('/api/students');
                const students = await response.json();
                const tbody = document.getElementById('studentTableBody');

                if (students.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color: var(--text-muted);">No records found in database.</td></tr>';
                    return;
                }

                tbody.innerHTML = students.map(s => `
                    <tr>
                        <td class="student-id">${s.id}</td>
                        <td>${s.firstName} ${s.lastName}</td>
                        <td>${s.email}</td>
                        <td>${s.phone || '-'}</td>
                        <td>${s.program || '-'}</td>
                        <td>${s.term || '-'}</td>
                        <td>${new Date(s.createdAt).toLocaleString()}</td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error('Failed to load database:', err);
                document.getElementById('studentTableBody').innerHTML =
                    '<tr><td colspan="7" style="text-align:center; color: var(--error-red);">Error loading database records.</td></tr>';
            }
        }

        loadDatabase();
    </script>
</body>

</html>
